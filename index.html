<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2 id="address">javascript</h2>
    <button type="button" onclick="myfun()">click here</button>
    <p>In this case JavaScript changes the value of the src (source) attribute of an image.</p>

    <button onclick="document.getElementById('myImage').src='./pic_bulbon.gif '">Turn on the light</button>

    <img id="myImage" src="./pic_bulboff.gif" style="width:100px">

    <button onclick="document.getElementById('myImage').src='./pic_bulboff.gif'">Turn off the light</button>
    <button type="button" onclick="document.getElementById('myImage' ).style.display='none' ">click</button>
    <button type="button" onclick="document.getElementById('myImage' ).style.display='block' ">click me</button>
    <script>
        function myfun() {
            document.getElementById('address').innerHTML = "helloo"
        }
    </script>

</body>

</html>
